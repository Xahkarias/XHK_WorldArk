  # events
  xhk_worldark_birchark.002.title:99 "Possibility of $xhk_pc_worldark$ Birch Integration"
  xhk_worldark_birchark.002.desc:99 "With the defeat of the Aeternum, the Birch world is now under [event_target:aeternite_conqueror.GetName] control. However, this will not stop us from conducting a feasibility analysis of integrating this technology into the $xhk_pc_worldark$."
  xhk_worldark_birchark.003.desc:99 "Rumors of the colonization of a Birch World have reached us, along with reports of the technologies within. We should conduct a feasibility analysis of integrating this technology into the $xhk_pc_worldark$."
  xhk_worldark_birchark.002.a:99 "We must analyze the Birch World."
  
  xhk_worldark_birchark.010.title:99 "Birch Analysis Complete"
  xhk_worldark_birchark.010.desc:99 "Examination of the Birch World has shown that its systems are potentially compatible with the $xhk_pc_worldark$. Further research is required."
  xhk_worldark_birchark.010.a:99 "Begin integration."
  xhk_worldark_birchark.010.att:99 "Begins the §I$xhk_worldark_situation_birchark$§! situation."
  
  xhk_worldark_birchark_chain_title:99 "Birch $xhk_pc_worldark$ Integration"
  xhk_worldark_birchark_chain_desc:99 "" #intentionally blank
  
  #project
  XHK_WORLDARK_BIRCHARK_ANALYSIS:99 "§IBirch $xhk_pc_worldark$§! Analysis"
  XHK_WORLDARK_BIRCHARK_ANALYSIS_DESC:99 "To analyze the feasibility of using Birch technology in the $xhk_pc_worldark$, we need to do scans of the Birch.\n\n§_The line below says that a starbase in orbit is needed, this means use the $xhk_pc_worldark$ for the special project.§!"
  
  # situation events
  xhk_worldark_birchark.1001.title:99 "Birch Integration: Feasible"
  xhk_worldark_birchark.1001.desc:99 "Through our analysis of the Birch World's systems, we have concluded that it is possible to integrate them into the $xhk_pc_worldark$. Space must be allocated for further analysis."
  xhk_worldark_birchark.1001.a:99 "Good."
  xhk_worldark_birchark.1001.att:99 "The §I$district_xhk_worldark_birch$ District§! must be constructed to continue."
  
  xhk_worldark_birchark.1002.title:99 "Birch Integration: Orykta Ready"
  xhk_worldark_birchark.1002.desc:99 "While the $xhk_pc_worldark$ does not surround a supermassive black hole like the Birch World does, and thus cannot use the Orykta extraction technologies, it is possible to adapt them for the $xhk_pc_worldark$. Using negative density micro-black holes in our extraction facilities allows for increased efficiency."
  xhk_worldark_birchark.1002.a:99 "This shall be done."
  xhk_worldark_birchark.1002.att:99 "The §I$zone_xhk_worldark_orykta$ Zone§! must be constructed to continue."
  
  xhk_worldark_birchark.1003.title:99 "Birch Integration: Ktisma Ready"
  xhk_worldark_birchark.1003.desc:99 "The Birch World increases manufacturing efficiency through intelligent placement of facilities, as well as its superior technology. While we can implement the technological upgrades, moving around the existing facilities on the $xhk_pc_worldark$ will be a painful but necessary task."
  xhk_worldark_birchark.1003.a:99 "This shall be done."
  xhk_worldark_birchark.1003.att:99 "The §I$zone_xhk_worldark_ktisma$ Zone§! must be constructed to continue."
  
  xhk_worldark_birchark.1004.title:99 "Birch Integration: Physma Ready"
  xhk_worldark_birchark.1004.desc:99 "The Birch World serves as a vast repository of knowledge and computation. Its Physma infrastructure allows scientific facilities to share resources on an unprecedented scale. Integrating these systems into the $xhk_pc_worldark$ will require the construction of a vast computational network, linking researchers and systems into a single scientific apparatus."
  xhk_worldark_birchark.1004.a:99 "This shall be done."
  xhk_worldark_birchark.1004.att:99 "The §I$zone_xhk_worldark_physma$ Zone§! must be constructed to continue."
  
  xhk_worldark_birchark.1010.title:99 "Birch Integration: Complete"
  xhk_worldark_birchark.1010.desc:99 "Birch World systems have been fully integrated into the $xhk_pc_worldark$. We now benefit from greatly increased efficiency in all our pursuits."
  xhk_worldark_birchark.1010.a:99 "Finally."
  xhk_worldark_birchark.1010.att:99 "The §IBirch Focus Buildings§! are now unlocked."