  xhk_worldark_situation_birchark:99 "$xhk_pc_worldark$ Birch Integration"
  xhk_worldark_situation_birchark_type:99 "$xhk_worldark_situation_birchark$"
  xhk_worldark_situation_birchark_desc:99 "It is evident that the technologies of the §IBirch World§! drastically improve productivity. The question is now if we can put them to work on the §I$xhk_pc_worldark$§!."
  
