  xhk_worldark_corespinal_planetgun:99 "Oblivionis Celestial Decimator"
  xhk_worldark_corespinal_planetgun_desc:99 "A Behemoth Planetcraft main weapon, grafted onto the heart of the $xhk_pc_worldark$. May it slay those foul enough to attempt to move the heavens against us."
  xhk_worldark_corespinal_planetgun_tt:99 "\n$ARKSHIP_COMPONENTS$\n$t$$ADDS_ARKSHIP_T_SLOTS$\n$t$This Spinal Mount is equipped with a §Y$XHK_ARKSHIP_CORESPINAL_PLANETGUN_WEAPON$§!."
  sm_xhk_worldark_corespinal_planetgun:99 "$xhk_worldark_corespinal_planetgun$"
  sm_xhk_worldark_corespinal_planetgun_desc:99 "$xhk_worldark_corespinal_planetgun_desc$"
  XHK_ARKSHIP_CORESPINAL_PLANETGUN_WEAPON:99 "Oblivionis Celestial Decimator"
  
  sm_xhk_worldark_corespinal_blackhole:99 "Atrahasis Penrose Decompressor"
  sm_xhk_worldark_corespinal_blackhole_desc:99 "A black hole, stolen from the inky void and turned ianto a chained heart for the $xhk_pc_worldark$. Produces a prodigious amount of matter and energy for us to utilize."
  xhk_worldark_corespinal_blackhole_tt:99 "\n§IColony Effect:§!\nSwaps the §IReactor§! and §IHarvester§! Districts for §GPenrose§! and §GDecompressor§! upgrades. These have over double jobs per district compared to their normal variations."
  
  sm_xhk_worldark_corespinal_nanite:99 "Draupnir Nanite Crucible"
  sm_xhk_worldark_corespinal_nanite_desc:99 "This module constantly leaks nanites into the surrounding system. They are not powerful enough to affect functional ships, but upon reaching a wreck they devour it, creating temporary vessels from their materials."
  xhk_worldark_corespinal_nanite_tt:99 "\n§ICombat Effect:§!\nFor every §G100 $concept_naval_capacity$§! destroyed in combat, creates a fleet of §G25§! $nanite_swarmer_plural$ and §G1§! $nanite_interdictor$ using §Irandom designs§! from your empire. §RThese ships are destroyed a month after combat ends.§!"
  NAME_XHK_WORLDARK_NANITE_SPAWN:99 "Temporary Nanite Swarm"
  
  sm_xhk_worldark_corespinal_virtual:99 "Trimegistus Omniscence Engine"
  sm_xhk_worldark_corespinal_virtual_desc:99 "A labyrinth of spindly radiator fins surrounds a processing server of immense power. In order to power it, a slurry of exotic materials must be used as coolant and vented into space. Wasteful, but the processing power is undeniable."
  
  xhk_worldark_corespinal_antisystem:99 "Xiuhcoatl Heaven Piercer"
  xhk_worldark_corespinal_antisystem_desc:99 "In order to counter the terrifying power of a $war_system_5$, we must equip the $xhk_pc_worldark$ with a weapon strong enough to slay them. Never before have we created a weapon as destructive, and may we never need it again."
  xhk_worldark_corespinal_antisystem_tt:99 "\n$ARKSHIP_COMPONENTS$\n$t$$ADDS_ARKSHIP_T_SLOTS$\n$t$This Spinal Mount is equipped with a §Y$XHK_ARKSHIP_CORESPINAL_ANTISYSTEM_WEAPON$§!."
  sm_xhk_worldark_corespinal_antisystem:99 "$xhk_worldark_corespinal_antisystem$"
  sm_xhk_worldark_corespinal_antisystem_desc:99 "$xhk_worldark_corespinal_antisystem_desc$"
  XHK_ARKSHIP_CORESPINAL_ANTISYSTEM_WEAPON:99 "Xiuhcoatl Heaven Piercer"
  