  # DISTRICTS + ZONES
  xhk_worldark_docs_districts:99 "3) Districts and Zones"
  xhk_worldark_docs_districts_desc:99 "$xhk_worldark_docs_districts_desc_1$$xhk_worldark_docs_districts_desc_group_city$$xhk_worldark_docs_districts_desc_group_manufactured$$xhk_worldark_docs_districts_desc_group_intellectual$$xhk_worldark_docs_districts_desc_group_warfare$$xhk_worldark_docs_districts_desc_group_strategicresource$$xhk_worldark_docs_districts_desc_group_utility$"
  xhk_worldark_docs_districts_desc_1:99 "The $xhk_pc_worldark$ contains many different districts and zones. Note that almost all districts are housing negative. Which ones are available to your empire are listed below (ignoring tech restrictions):\n"
  
