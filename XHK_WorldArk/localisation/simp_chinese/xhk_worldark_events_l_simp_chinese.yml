  xhk_worldark_docs_districts_desc_research:99 "\n£research£§G$district_xhk_worldark_research$§!:  Provides a balanced distribution of [GetResearcher] jobs.$TABBED_NEW_LINE$- §C$zone_xhk_worldark_research$§!: Adds [GetResearcher] jobs.$TABBED_NEW_LINE$- §C$zone_xhk_worldark_physics$§!: Adds [GetPhysicsJob] jobs.$TABBED_NEW_LINE$- §C$zone_xhk_worldark_society$§!: Adds [GetBiologyJob] jobs.$TABBED_NEW_LINE$- §C$zone_xhk_worldark_engineering$§!: Adds [GetEngineerJob] jobs."
