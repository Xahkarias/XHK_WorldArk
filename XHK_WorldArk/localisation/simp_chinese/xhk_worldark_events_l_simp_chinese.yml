  xhk_worldark_docs_districts_desc_group_strategicresource:99 "$xhk_worldark_docs_districts_desc_group_strategicresource_header$$xhk_worldark_docs_districts_desc_refinery$$xhk_worldark_docs_districts_desc_darkmatter$[owner.xhk_worldark_getDistrictDoc_EHOF]"
