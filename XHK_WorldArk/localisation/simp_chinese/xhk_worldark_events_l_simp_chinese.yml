  xhk_worldark_docs_districts_desc_dystopian:99 "\n£amenities£§G$district_xhk_worldark_amenities_dystopian$§!:  Provides small amount of $job_politician$ jobs. §RLimited by population size.§!$TABBED_NEW_LINE$- §C$zone_xhk_worldark_amenities_dystopian$§!:  Adds $job_politician$ jobs."
