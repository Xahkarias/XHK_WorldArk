  xhk_worldark_docs_ship_levels:99 "4) $xhk_pc_worldark$ Ship Levels"
  xhk_worldark_docs_ship_levels_desc:99 "$xhk_worldark_docs_ship_levels_desc_1$$xhk_worldark_docs_ship_levels_desc_2$$xhk_worldark_docs_ship_levels_desc_T1$$xhk_worldark_docs_ship_levels_desc_T2$$xhk_worldark_docs_ship_levels_desc_T3$$xhk_worldark_docs_ship_levels_desc_T3_2$$xhk_worldark_docs_ship_levels_desc_T4$$xhk_worldark_docs_ship_levels_desc_T5$$xhk_worldark_docs_ship_levels_desc_T5_2$$xhk_worldark_docs_ship_levels_desc_T6$$xhk_worldark_docs_ship_levels_desc_T6_2$$xhk_worldark_docs_ship_levels_desc_T7$$xhk_worldark_docs_ship_levels_desc_T8$$xhk_worldark_docs_ship_levels_desc_T9$$xhk_worldark_docs_ship_levels_desc_T10$$xhk_worldark_docs_ship_levels_desc_midgame$$xhk_worldark_docs_ship_levels_desc_T11$$xhk_worldark_docs_ship_levels_desc_T11_2$$xhk_worldark_docs_ship_levels_desc_T12$"
  xhk_worldark_docs_ship_levels_desc_1:99 "The $xhk_pc_worldark$ gains multiple bonuses when leveling up the ship itself. While it gains bonuses such as increasingly larger defensive stats, and a mixture of the vanilla arkship bonuses, this list below notes the starbase, district, and weapons per level.\n"
  xhk_worldark_docs_ship_levels_desc_2:99 "\nFurthermore, gain §G+5000 $mod_situation_nomad_economy_max_progress_add$§! per $xhk_pc_worldark$ level.\n"
  xhk_worldark_docs_ship_levels_desc_T1:99 "\n§GT1§! - §YStarbase:§!  4 Modules /  4 Buildings / 0 Spinal | §YBase Districts:§! 10 | §YWeapons:§!  2H  4P  4M"
  xhk_worldark_docs_ship_levels_desc_T2:99 "\n§GT2§! - §YStarbase:§!  8 Modules /  8 Buildings / 0 Spinal | §YBase Districts:§! 14 | §YWeapons:§!  4H  8P  4L"
  xhk_worldark_docs_ship_levels_desc_T3:99 "\n§GT3§! - §YStarbase:§! 12 Modules / 12 Buildings / 0 Spinal | §YBase Districts:§! 18 | §YWeapons:§!  6H 16P  8L"
  xhk_worldark_docs_ship_levels_desc_T3_2:99 "\n$t$$t$Unlocks §GFirst $district_xhk_worldark_city$§! Specialization."
  xhk_worldark_docs_ship_levels_desc_T4:99 "\n§GT4§! - §YStarbase:§! 16 Modules / 16 Buildings / 0 Spinal | §YBase Districts:§! 22 | §YWeapons:§!  8H 20P 12L"
  xhk_worldark_docs_ship_levels_desc_T5:99 "\n§GT5§! - §YStarbase:§! 16 Modules / 20 Buildings / 0 Spinal | §YBase Districts:§! 26 | §YWeapons:§! 12H 24P 16L"
  xhk_worldark_docs_ship_levels_desc_T5_2:99 "\n$t$$t$§I$xhk_worldark_size_harvest$§!: §GMax £districtadd£District Gain§! increases to §G+[xhk_worldark_getDistrictIncreaseFromHarvest_large]§!"
  xhk_worldark_docs_ship_levels_desc_T6:99 "\n§GT6§! - §YStarbase:§! 20 Modules / 24 Buildings / 0 Spinal | §YBase Districts:§! 30 | §YWeapons:§! 16H 28P 20L"
  xhk_worldark_docs_ship_levels_desc_T6_2:99 "\n$t$$t$Unlocks §GSecond $district_xhk_worldark_city$§! Specialization."
  xhk_worldark_docs_ship_levels_desc_T7:99 "\n§GT7§! - §YStarbase:§! 24 Modules / 28 Buildings / 0 Spinal | §YBase Districts:§! 34 | §YWeapons:§! 18H 30P 24L"
  xhk_worldark_docs_ship_levels_desc_T8:99 "\n§GT8§! - §YStarbase:§! 24 Modules / 32 Buildings / 2 Spinal | §YBase Districts:§! 38 | §YWeapons:§! 20H 32P 30L"
  xhk_worldark_docs_ship_levels_desc_T9:99 "\n§GT9§! - §YStarbase:§! 24 Modules / 36 Buildings / 4 Spinal | §YBase Districts:§! 44 | §YWeapons:§! 24H 36P 36L"
  xhk_worldark_docs_ship_levels_desc_T10:99 "\n§GT10§!- §YStarbase:§! 24 Modules / 40 Buildings / 6 Spinal | §YBase Districts:§! 50 | §YWeapons:§! 30H 40P 40L"
  xhk_worldark_docs_ship_levels_desc_midgame:99 "\n§RThe following levels are locked behind§! §Y$tech_mega_engineering$§!§R:§!"
