  xhk_worldark_docs_districts_desc_hive:99 "\n£unity£§G$district_xhk_worldark_unity_hive$§!:  Provides [GetBureaucrat] jobs.$xhk_worldark_docs_districts_desc_base_zone$"
  xhk_worldark_docs_districts_desc_mach:99 "\n£unity£§G$district_xhk_worldark_unity$§!:  Provides [GetBureaucrat] jobs.$xhk_worldark_docs_districts_desc_base_zone$"
