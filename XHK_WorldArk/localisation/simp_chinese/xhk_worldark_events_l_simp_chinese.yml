l_simp_chinese:
  xhk_worldark_new_capital_name:99 "[xhk_old_arkcap_colony.GetName]"
  xhk_worldark_new_fleet_name:99 "[xhk_old_arkcap_fleet.GetName]"
  
  XHK_TOAST_CONSUME_ARKSHIP_COMPLETE_TITLE:99 "$XHK_TOAST_HARVEST_SIZE_COMPLETE_TITLE$"
  XHK_TOAST_CONSUME_ARKSHIP_COMPLETE_DESC:99 "The §Y$PLANET$§! has expanded its size by consuming our recently acquired arkships."
  
  #######################################################################################################################
  # Situation log category
  xhk_worldark_situation_category:99 "$xhk_pc_worldark$ Matters"
  xhk_worldark_null_text:99 ""
  
  # Situation
  xhk_worldark_situation_main:99 "$xhk_pc_worldark$ Status"
  xhk_worldark_situation_main_desc:99 "This situation serves to track the special status of the $xhk_pc_worldark$ and any special buffs / debuffs that are applied to it."
  
  xhk_worldark_situation_main_stage:99 "Normal Stage"
  xhk_worldark_situation_main_approach:99 "Standard Approach"
  xhk_worldark_situation_main_approach_tt:99 "We roam the void"
  
  #######################################################################################################################
  #######################################################################################################################
  #######################################################################################################################
  #######################################################################################################################
  # Documentation
  xhk_worldark_docs_chain_title:99 "$xhk_pc_worldark$ Documentation"
  xhk_worldark_docs_chain_desc:99 ""The §Y$xhk_pc_worldark$§! origin provides a \"One Planet\" play style, with heavy focus on a single capital arkship. You cannot build another arkship, and any that you gain are scuttled to buff the capital arkship. The $xhk_pc_worldark$ gains access to many powerful districts, modules, systems, and decisions."
  
  ####################
  # EXPANSION
  xhk_worldark_docs_expansion:99 "1) Expansion"
  xhk_worldark_docs_expansion_desc:99 "$xhk_worldark_docs_expansion_desc_1$$xhk_worldark_docs_expansion_desc_2$$xhk_worldark_docs_expansion_desc_3$$xhk_worldark_docs_expansion_desc_4$$xhk_worldark_docs_expansion_desc_5$$xhk_worldark_docs_expansion_desc_6$$xhk_worldark_docs_expansion_desc_7$[owner.xhk_worldark_getVirtualDocumentation]"
  xhk_worldark_docs_expansion_desc_1:99 "The $xhk_pc_worldark$ expands through the dismantlement of other stellar objects. These are listed below:"
  xhk_worldark_docs_expansion_desc_2:99 "$TABBED_NEW_LINE$- §G+6 £districtadd£District§! from the special §I$xhk_worldark_size_harvest$§! arkship action, when used on a stellar body."
  xhk_worldark_docs_expansion_desc_3:99 "$TABBED_NEW_LINE$      Increases size gain after specific $xhk_pc_worldark$ Upgrades."
  xhk_worldark_docs_expansion_desc_4:99 "$TABBED_NEW_LINE$- §G+4 £districtadd£Districts§! from each arkship claimed from another empire after a war, which are promptly dismantled."
  xhk_worldark_docs_expansion_desc_5:99 "$TABBED_NEW_LINE$- §G+1 £districtadd£District§! and §G+1 £construction_ship£Logistic Ship Capacity§! from the §I$xhk_worldark_add_logistics_ship$§! arkship decision."
  xhk_worldark_docs_expansion_desc_6:99 "$TABBED_NEW_LINE$- §G+5 £districtadd£Districts§! per $xhk_pc_worldark$ level. These do §RNOT grant extra growth jobs§!."
  xhk_worldark_docs_expansion_desc_7:99 "\n\nThe §I$xhk_worldark_size_harvest$§! action should be taken frequently in order to continue to grow the $xhk_pc_worldark$."
  xhk_worldark_docs_expansion_desc_virt:99 "\n\nNote: For §IVirtual Empires§!, every built district §Rover 25§! counts as §R0.05 colonies§! for the purposes of the Virtual efficiency bonus."
  
  ####################
  # POPULATION
  xhk_worldark_docs_population:99 "2) Population"
  xhk_worldark_docs_population_desc:99 "$xhk_worldark_docs_population_desc_1$$xhk_worldark_docs_population_desc_2$$xhk_worldark_docs_population_desc_3$\n[Owner.xhk_worldark_getPopulationDocumentation]"
  xhk_worldark_docs_population_desc_1:99 "In order to keep the population of the $xhk_pc_worldark$ mildly competitive, it gains extra growth jobs based on the size of the $xhk_pc_worldark$."
  xhk_worldark_docs_population_desc_2:99 "\n\nPer £district£district increase, §G+10 Pop Growth§! jobs are added, which are then turned into actual jobs / buffs based on your empire and the buildings."
  xhk_worldark_docs_population_desc_3:99 "\nEach §GPop Growth§! job also grants +1 $MOD_AUTO_MOD_MONTHLY_ADD$."
  
  xhk_worldark_docs_population_desc_norm:99 "$xhk_worldark_docs_population_desc_norm_1$$xhk_worldark_docs_population_desc_norm_2$$xhk_worldark_docs_population_desc_norm_3$$xhk_worldark_docs_population_desc_norm_4$$xhk_worldark_docs_population_desc_norm_5$$xhk_worldark_docs_population_desc_norm_6$"
  xhk_worldark_docs_population_desc_norm_1:99 "\n§3Individualist Biological Empire§!: Base of §G+100 $job_xhk_worldark_extra_healthcare_plural$§! per 100 Pop Growth Jobs. Below lines add extra effects."
  xhk_worldark_docs_population_desc_norm_2:99 "$TABBED_NEW_LINE$- Any §IRobot Assembly§! Building: §G+25 $job_roboticist_plural$§! per 100 Pop Growth Jobs."
  xhk_worldark_docs_population_desc_norm_3:99 "$TABBED_NEW_LINE$- §IClone Vat§! Building: §G+1 $mod_fake_pop_growth_mod$§! per 100 $job_xhk_worldark_extra_healthcare_plural$ Jobs."
  xhk_worldark_docs_population_desc_norm_4:99 "$TABBED_NEW_LINE$- Has §ICloning Tradition§!: §G+0.5 $mod_fake_pop_growth_mod$§! per 100 $job_xhk_worldark_extra_healthcare_plural$ Jobs."
  xhk_worldark_docs_population_desc_norm_5:99 "$TABBED_NEW_LINE$- Completed §ISynthetic Ascension§!: Replace all above effects to §G+75 $job_roboticist_plural$§! per 100 Pop Growth Jobs."
  xhk_worldark_docs_population_desc_norm_6:99 "$TABBED_NEW_LINE$- Any §IZombie Assembly§! Building: §G+25 $job_reassigner_plural$§! per 100 Pop Growth Jobs."
  
  xhk_worldark_docs_population_desc_hive:99 "$xhk_worldark_docs_population_desc_hive_1$$xhk_worldark_docs_population_desc_hive_2$"
  xhk_worldark_docs_population_desc_hive_1:99 "\n§3Gestalt Hive Empire§!: Base of §G+100 $job_spawning_drone_plural$§! per 100 Pop Growth Jobs. Below lines add extra effects."
  xhk_worldark_docs_population_desc_hive_2:99 "$TABBED_NEW_LINE$- Completed §ICybernetic Ascension§!: §G+33 $job_augmentor_drone_plural$§! per 100 Pop Growth Jobs!."
  
  xhk_worldark_docs_population_desc_machine:99 "$xhk_worldark_docs_population_desc_machine_1$$xhk_worldark_docs_population_desc_machine_2$$xhk_worldark_docs_population_desc_machine_3$$xhk_worldark_docs_population_desc_machine_4$"
  xhk_worldark_docs_population_desc_machine_1:99 "\n§3Gestalt Machine Empire§!: Base of §G+150 $job_replicator_plural$§! per 100 Pop Growth Jobs. Below lines add extra effects."
  xhk_worldark_docs_population_desc_machine_2:99 "$TABBED_NEW_LINE$- Completed §ICybernetic Ascension§!: §G+33 $job_augmentor_drone_plural$§! per 100 Pop Growth Jobs!."
  xhk_worldark_docs_population_desc_machine_3:99 "$TABBED_NEW_LINE$- §IRogue Servitor§! Civic: §G+50 $job_xhk_worldark_extra_healthcare_drone_plural$§! per 100 Pop Growth Jobs."
  xhk_worldark_docs_population_desc_machine_4:99 "$TABBED_NEW_LINE$- §IVirtual Ascension§!: §RLose ALL§! Pop Growth Jobs (Except for $job_xhk_worldark_extra_healthcare_drone_plural$)."
  
  xhk_worldark_docs_population_desc_indiv_machine:99 "$xhk_worldark_docs_population_desc_indiv_machine_1$$xhk_worldark_docs_population_desc_indiv_machine_2$"
  xhk_worldark_docs_population_desc_indiv_machine_1:99 "\n§3Individualist Machine Empire§!: Base of §G+75 $job_roboticist_plural$§! per 100 Pop Growth Jobs."
  xhk_worldark_docs_population_desc_indiv_machine_2:99 "$TABBED_NEW_LINE$- §IVirtual Ascension§!: §RLose ALL§! Pop Growth Jobs."
  
