  xhk_worldark_docs_districts_desc_group_city_header:99 "\n§l------HOUSING--------------------------------------------§!"
  xhk_worldark_docs_districts_desc_city:99 "\n£housing£§G$district_xhk_worldark_city$§!: Provides housing and building slots.$TABBED_NEW_LINE$- 2x §C$zone_urban$§!: Provides more housing and building slots."
  
