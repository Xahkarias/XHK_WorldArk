l_english:
 xhk_worldark_new_capital_name:0 "[xhk_old_arkcap_colony.GetName]"
 xhk_worldark_new_fleet_name:0 "[xhk_old_arkcap_fleet.GetName]"

 XHK_TOAST_CONSUME_ARKSHIP_COMPLETE_TITLE: "$XHK_TOAST_HARVEST_SIZE_COMPLETE_TITLE$"
 XHK_TOAST_CONSUME_ARKSHIP_COMPLETE_DESC: "The §Y$PLANET$§! has expanded its size by consuming our recently acquired arkships."

 #######################################################################################################################
 # Situation log category
 xhk_worldark_situation_category: "$xhk_pc_worldark$ Matters"

 # Situation
 xhk_worldark_situation_main: "$xhk_pc_worldark$ Status"
 xhk_worldark_situation_main_desc: "This situation serves to track the special status of the $xhk_pc_worldark$ and any special buffs / debuffs that are applied to it."

 xhk_worldark_situation_main_stage: "Normal Stage"
 xhk_worldark_situation_main_approach: "Standard Approach"

 #######################################################################################################################
 # Documentation
 xhk_worldark_docs_chain_title: "$xhk_pc_worldark$ Documentation"
 xhk_worldark_docs_chain_desc: ""The §Y$xhk_pc_worldark$§! origin provides a \"One Planet\" play style, with heavy focus on a single capital arkship. You cannot build another arkship, and any that you gain are scuttled to buff the capital arkship. The $xhk_pc_worldark$ gains access to many powerful districts, modules, systems, and decisions."

 ####################
 # EXPANSION
 xhk_worldark_docs_expansion: "1) Expansion"
 xhk_worldark_docs_expansion_desc: "$xhk_worldark_docs_expansion_desc_1$$xhk_worldark_docs_expansion_desc_2$$xhk_worldark_docs_expansion_desc_3$$xhk_worldark_docs_expansion_desc_4$$xhk_worldark_docs_expansion_desc_5$$xhk_worldark_docs_expansion_desc_6$$xhk_worldark_docs_expansion_desc_7$"
 xhk_worldark_docs_expansion_desc_1: "The $xhk_pc_worldark$ expands through the dismantlement of other stellar objects. These are listed below:"
 xhk_worldark_docs_expansion_desc_2: "$TABBED_NEW_LINE$- §G+1 £districtadd£District§! from the special §I$xhk_worldark_size_harvest$§! arkship action, when used on a stellar body."
 xhk_worldark_docs_expansion_desc_3: "$TABBED_NEW_LINE$      Increases to §G+2 £districtadd£District§! when upgraded to at least §I$xhk_worldark_tier_5$§!."
 xhk_worldark_docs_expansion_desc_4: "$TABBED_NEW_LINE$- §G+4 £districtadd£Districts§! from each arkship claimed from another empire after a war, which are promptly dismantled."
 xhk_worldark_docs_expansion_desc_5: "$TABBED_NEW_LINE$- §G+1 £districtadd£District§! and §G+1 £construction_ship£Logistic Ship Capacity§! from the §I$xhk_worldark_add_logistics_ship$§! arkship decision."
 xhk_worldark_docs_expansion_desc_6: "$TABBED_NEW_LINE$- §G+5 £districtadd£Districts§! per $xhk_pc_worldark$ level. These do §RNOT grant extra growth jobs§!."
 xhk_worldark_docs_expansion_desc_7: "\n\nThe §I$xhk_worldark_size_harvest$§! action should be taken frequently in order to continue to grow the $xhk_pc_worldark$."

 ####################
 # POPULATION
 xhk_worldark_docs_population: "2) Population"
 xhk_worldark_docs_population_desc: "$xhk_worldark_docs_population_desc_1$$xhk_worldark_docs_population_desc_2$\n[Owner.xhk_worldark_getPopulationDocumentation]"
 xhk_worldark_docs_population_desc_1: "In order to keep the population of the $xhk_pc_worldark$ mildly competitive, it gains extra growth jobs based on the size of the $xhk_pc_worldark$."
 xhk_worldark_docs_population_desc_2: "\n\nPer £district£district increase, §G+15 Pop Growth§! jobs are added, which are then turned into actual jobs / buffs based on your empire and the buildings."

 xhk_worldark_docs_population_desc_norm: "$xhk_worldark_docs_population_desc_norm_1$$xhk_worldark_docs_population_desc_norm_2$$xhk_worldark_docs_population_desc_norm_3$$xhk_worldark_docs_population_desc_norm_4$$xhk_worldark_docs_population_desc_norm_5$$xhk_worldark_docs_population_desc_norm_6$"
 xhk_worldark_docs_population_desc_norm_1: "\n§3Individualist Biological Empire§!: Base of §G1 $job_healthcare$§! per Growth Job."
 xhk_worldark_docs_population_desc_norm_2: "$TABBED_NEW_LINE$- Any §IRobot Assembly§! Building: Loses half $job_healthcare_plural$, replaces with §G$job_roboticist_plural$§!."
 xhk_worldark_docs_population_desc_norm_3: "$TABBED_NEW_LINE$- §IClone Vat§! Building: Loses half $job_healthcare_plural$, replaces with §G+0.0075 Organic Pop Growth§! per job."
 xhk_worldark_docs_population_desc_norm_4: "\n      §ICloning Tradition§! tree doubles this §GMonthly Organic Pop Growth§!."
 xhk_worldark_docs_population_desc_norm_5: "$TABBED_NEW_LINE$- Completed §ISynthetic Ascension§!: Swap all above effects to §G1 $job_roboticist_plural$§! per Growth Job."
 xhk_worldark_docs_population_desc_norm_6: "$TABBED_NEW_LINE$- Any §IZombie Assembly§! Building: Adds §G0.25 $job_reassigner_plural$§! per Growth Job, stacks with any above effect."

 xhk_worldark_docs_population_desc_hive: "$xhk_worldark_docs_population_desc_hive_1$$xhk_worldark_docs_population_desc_hive_2$"
 xhk_worldark_docs_population_desc_hive_1: "\n§3Gestalt Hive Empire§!: Base of §G1 $job_spawning_drone$§! per Growth Job."
 xhk_worldark_docs_population_desc_hive_2: "$TABBED_NEW_LINE$- Completed §ICybernetic Ascension§!: Loses half $job_spawning_drone_plural$, replaces with §G$job_augmentor_drone_plural$§!."

 xhk_worldark_docs_population_desc_machine: "$xhk_worldark_docs_population_desc_machine_1$$xhk_worldark_docs_population_desc_machine_2$"
 xhk_worldark_docs_population_desc_machine_1: "\n§3Gestalt Machine Empire§!: Base of §G1 $job_replicator$§! per Growth Job."
 xhk_worldark_docs_population_desc_machine_2: "$TABBED_NEW_LINE$- Completed §ICybernetic Ascension§!: Loses half $job_replicator_plural$, replaces with §G$job_augmentor_drone_plural$§!."

 xhk_worldark_docs_population_desc_indiv_machine: "$xhk_worldark_docs_population_desc_indiv_machine_1$$xhk_worldark_docs_population_desc_indiv_machine_2$"
 xhk_worldark_docs_population_desc_indiv_machine_1: "\n§3Individualist Machine Empire§!: Base of §G1 $job_roboticist$§! per Growth Job."
 xhk_worldark_docs_population_desc_indiv_machine_2: "$TABBED_NEW_LINE$- §IClone Vat§! Building: Loses a third of $job_roboticist_plural$, replaces with §G+0.005 Organic Pop Growth§! per job."

 ####################
 # DISTRICTS + ZONES
 xhk_worldark_docs_districts: "3) Districts and Zones"

 ####################
 # CIVICS
 xhk_worldark_docs_special_civic: "4) Civic Integration"
 xhk_worldark_docs_special_civic_desc: "$xhk_worldark_docs_special_civic_desc_1$\n$xhk_worldark_docs_special_civic_desc_dystopia$"
 xhk_worldark_docs_special_civic_desc_1: "The $xhk_pc_worldark$ has special integration with specific civics to better fit their fantasy and compensate for the one-planet playstyle."
 xhk_worldark_docs_special_civic_desc_dystopia: "\n§EOppressive Autocracy§!: $district_xhk_worldark_amenities_plural$ give $job_politician_plural$ instead of $job_entertainer_plural$, and are capped based on population."


 ####################
 # MEGAS
 xhk_worldark_docs_mega_integration: "5) Megastructure Integration"

 ####################
 # CROSSMOD
 xhk_worldark_docs_crossmod: "6) Cross-Mod Support"






