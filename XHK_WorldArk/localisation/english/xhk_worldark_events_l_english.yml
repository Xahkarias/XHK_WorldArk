 # Documentation
 xhk_worldark_docs_chain_title: "$xhk_pc_worldark$ Documentation"
 xhk_worldark_docs_chain_desc: "The §Y$xhk_pc_worldark$§! origin provides a \"§IOne Planet§!\" play style, with heavy focus on a single capital arkship. You §Rcannot build another arkship§!, and any that you gain are §Rscuttled to buff the capital§! arkship. The $xhk_pc_worldark$ gains access to many powerful districts, modules, systems, and decisions."

 ####################
 # EXPANSION
 xhk_worldark_docs_expansion: "1) Expansion"
 xhk_worldark_docs_expansion_desc: "$xhk_worldark_docs_expansion_desc_1$$xhk_worldark_docs_expansion_desc_2$$xhk_worldark_docs_expansion_desc_3$$xhk_worldark_docs_expansion_desc_4$$xhk_worldark_docs_expansion_desc_5$$xhk_worldark_docs_expansion_desc_6$$xhk_worldark_docs_expansion_desc_7$$xhk_worldark_docs_expansion_desc_8$$xhk_worldark_docs_expansion_desc_9$$xhk_worldark_docs_expansion_desc_10$$xhk_worldark_docs_expansion_desc_11$[owner.xhk_worldark_getVirtualDocumentation]"
 xhk_worldark_docs_expansion_desc_1: "The $xhk_pc_worldark$ expands through the dismantlement of other stellar objects. These are listed below:\n"
 xhk_worldark_docs_expansion_desc_2: "$TABBED_NEW_LINE$- $xhk_harvest_plus_small$ §G£districtadd£Districts§! from the special §I$xhk_worldark_size_harvest$§! arkship action, when used on a stellar body."
 xhk_worldark_docs_expansion_desc_3: "$TABBED_NEW_LINE$      Increases size gain after specific $xhk_pc_worldark$ Upgrades."
 xhk_worldark_docs_expansion_desc_4: "$TABBED_NEW_LINE$- §G+$@xhk_worldark_consume_ark_size|0$ £districtadd£Districts§! from each arkship claimed from another empire after a war, which are promptly dismantled."
 xhk_worldark_docs_expansion_desc_5: "$TABBED_NEW_LINE$- §G+X £districtadd£Districts§! from dismantling §IPlanets§! with the §I$xhk_worldark_corespinal_planeteater$§!."
 xhk_worldark_docs_expansion_desc_6: "\n  §RThe following expansion methods do NOT grant extra growth jobs§!"
 xhk_worldark_docs_expansion_desc_7: "$TABBED_NEW_LINE$- §G+$@xhk_worldark_logisticbay_size|0$ £districtadd£District§! and §G+1 £construction_ship£Logistic Ship Capacity§! per use of the §I$xhk_worldark_add_logistics_ship$§! decision."
 xhk_worldark_docs_expansion_desc_8: "$TABBED_NEW_LINE$- §G+5 £districtadd£Districts§! per $xhk_pc_worldark$ level."
 xhk_worldark_docs_expansion_desc_9: "$TABBED_NEW_LINE$- §G+$@xhk_worldark_consume_hab_size|0$ £districtadd£Districts§! per dismantled §IHabitat§! (§IRight Click§! on §Runcolonized habitats§! in §Runclaimed space§!)."
 xhk_worldark_docs_expansion_desc_10: "$TABBED_NEW_LINE$- §G+$@xhk_worldark_alloy_build_size|0$ £districtadd£Districts§! per usage of §I$xhk_worldark_alloy_expansion_decision$§! decision (unlocked with §I$tech_mega_engineering$§!)."
 xhk_worldark_docs_expansion_desc_11: "\n\nThe §I$xhk_worldark_size_harvest$§! action should be taken frequently in order to continue to grow the $xhk_pc_worldark$."
 xhk_worldark_docs_expansion_desc_virt: "\n\nNote: For §IVirtual Empires§!, every built district §Rover 25§! counts as §R0.05 colonies§! for the purposes of the Virtual efficiency bonus."

 ####################
 # POPULATION
 xhk_worldark_docs_population: "2) Population"
 xhk_worldark_docs_population_desc: "$xhk_worldark_docs_population_desc_1$$xhk_worldark_docs_population_desc_2$$xhk_worldark_docs_population_desc_3$\n[Owner.xhk_worldark_getPopulationDocumentation]"
 xhk_worldark_docs_population_desc_1: "In order to keep the population of the $xhk_pc_worldark$ mildly competitive, it gains extra growth jobs based on the size of the $xhk_pc_worldark$."
 xhk_worldark_docs_population_desc_2: "\n\nPer £district£district increase, §G+10 Pop Growth§! jobs are added, which are then turned into actual jobs / buffs based on your empire and the buildings."
 xhk_worldark_docs_population_desc_3: "\nEach §GPop Growth§! job also grants +1 $MOD_AUTO_MOD_MONTHLY_ADD$."

 xhk_worldark_docs_population_desc_norm: "$xhk_worldark_docs_population_desc_norm_1$$xhk_worldark_docs_population_desc_norm_2$$xhk_worldark_docs_population_desc_norm_3$$xhk_worldark_docs_population_desc_norm_4$$xhk_worldark_docs_population_desc_norm_5$$xhk_worldark_docs_population_desc_norm_6$"
 xhk_worldark_docs_population_desc_norm_1: "\n§3Individualist Biological Empire§!: Base of §G+100 $job_xhk_worldark_extra_healthcare_plural$§! per 100 Pop Growth Jobs. Below lines add extra effects."
 xhk_worldark_docs_population_desc_norm_2: "$TABBED_NEW_LINE$- Any §IRobot Assembly§! Building: §G+25 $job_roboticist_plural$§! per 100 Pop Growth Jobs."
 xhk_worldark_docs_population_desc_norm_3: "$TABBED_NEW_LINE$- §IClone Vat§! Building: §G+1 $mod_fake_pop_growth_mod$§! per 100 $job_xhk_worldark_extra_healthcare_plural$ Jobs."
 xhk_worldark_docs_population_desc_norm_4: "$TABBED_NEW_LINE$- Has §ICloning Tradition§!: §G+0.5 $mod_fake_pop_growth_mod$§! per 100 $job_xhk_worldark_extra_healthcare_plural$ Jobs."
 xhk_worldark_docs_population_desc_norm_5: "$TABBED_NEW_LINE$- Completed §ISynthetic Ascension§!: Replace all above effects to §G+75 $job_roboticist_plural$§! per 100 Pop Growth Jobs."
 xhk_worldark_docs_population_desc_norm_6: "$TABBED_NEW_LINE$- Any §IZombie Assembly§! Building: §G+25 $job_reassigner_plural$§! per 100 Pop Growth Jobs."

 xhk_worldark_docs_population_desc_hive: "$xhk_worldark_docs_population_desc_hive_1$$xhk_worldark_docs_population_desc_hive_2$"
 xhk_worldark_docs_population_desc_hive_1: "\n§3Gestalt Hive Empire§!: Base of §G+100 $job_spawning_drone_plural$§! per 100 Pop Growth Jobs. Below lines add extra effects."
 xhk_worldark_docs_population_desc_hive_2: "$TABBED_NEW_LINE$- Completed §ICybernetic Ascension§!: §G+33 $job_augmentor_drone_plural$§! per 100 Pop Growth Jobs!."

 xhk_worldark_docs_population_desc_machine: "$xhk_worldark_docs_population_desc_machine_1$$xhk_worldark_docs_population_desc_machine_2$$xhk_worldark_docs_population_desc_machine_3$$xhk_worldark_docs_population_desc_machine_4$"
 xhk_worldark_docs_population_desc_machine_1: "\n§3Gestalt Machine Empire§!: Base of §G+150 $job_replicator_plural$§! per 100 Pop Growth Jobs. Below lines add extra effects."
 xhk_worldark_docs_population_desc_machine_2: "$TABBED_NEW_LINE$- Completed §ICybernetic Ascension§!: §G+33 $job_augmentor_drone_plural$§! per 100 Pop Growth Jobs!."
 xhk_worldark_docs_population_desc_machine_3: "$TABBED_NEW_LINE$- §IRogue Servitor§! Civic: §G+50 $job_xhk_worldark_extra_healthcare_drone_plural$§! per 100 Pop Growth Jobs."
 xhk_worldark_docs_population_desc_machine_4: "$TABBED_NEW_LINE$- §IVirtual Ascension§!: §RLose ALL§! Pop Growth Jobs (Except for $job_xhk_worldark_extra_healthcare_drone_plural$)."

 xhk_worldark_docs_population_desc_indiv_machine: "$xhk_worldark_docs_population_desc_indiv_machine_1$$xhk_worldark_docs_population_desc_indiv_machine_2$$xhk_worldark_docs_population_desc_indiv_machine_3$"
 xhk_worldark_docs_population_desc_indiv_machine_1: "\n§3Individualist Machine / Synthetic Empire§!: Base of §G+75 $job_roboticist_plural$§! per 100 Pop Growth Jobs."
 xhk_worldark_docs_population_desc_indiv_machine_2: "$TABBED_NEW_LINE$- Cloning Vats: §G+50 $job_xhk_worldark_extra_healthcare_plural$§! per 100 Pop Growth Jobs."
 xhk_worldark_docs_population_desc_indiv_machine_3: "$TABBED_NEW_LINE$- §IVirtual Ascension§!: §RLose ALL§! Pop Growth Jobs."

