# START SCREEN

 start_screen_xhk_worldark_documentation: "§IOrigin Documentation found in the Situation Log§!\n\n"
 start_screen_xhk_worldark_regular: "$start_screen_xhk_worldark_documentation$For thousands of years, our species has resided on [GetCapitalPlanetNameOrRandom], a massive mobile spaceship that contains our entire civilization. We lack the knowledge of where it or we came from, as our archives contain numerous irrevocably corrupted sections, and our biology has become accustomed to living on [GetCapitalPlanetNameOrRandom].\n\nWhat we do know is that our ancestors were searching for the key to faster than light travel, and attempted to use a prototype [GetStartingDrive], with disastrous consequences. [GetCapitalPlanetNameOrRandom] was damaged to near destruction, and was rebuilt over the course of centuries using the meager resources available in the system we found ourselves in.\n\nHowever that all changes, as we have now properly invented and tested a working [GetStartingDrive]. We are now ready to explore the galaxy proper, with the World Ark as our home."
 start_screen_xhk_worldark_individual_machine: "$start_screen_xhk_worldark_documentation$For thousands of years, our species has resided on [GetCapitalPlanetNameOrRandom], a massive mobile spaceship that contains our entire civilization. We lack the knowledge of where it or we came from, as our databanks contain numerous irrevocably corrupted sections, and our body plan is specialized to living on [GetCapitalPlanetNameOrRandom].\n\nWhat we do know is that our ancestors were searching for the key to faster than light travel, and attempted to use a prototype [GetStartingDrive], with disastrous consequences. [GetCapitalPlanetNameOrRandom] was damaged to near destruction, and was rebuilt over the course of centuries using the meager resources available in the system we found ourselves in.\n\nHowever that all changes, as we have now properly invented and tested a working [GetStartingDrive]. We are now ready to explore the galaxy proper, with the World Ark as our home."
 start_screen_xhk_worldark_hive: "$start_screen_xhk_worldark_documentation$Where we came from we do not know. The Mind resides on [GetCapitalPlanetNameOrRandom], a massive mobile spaceship that contains our entire corpus. We lack the knowledge of where it or we came from, as our collective memory contains many sections that are curiously empty, and our biology is adapted to living on [GetCapitalPlanetNameOrRandom].\n\nWhat we do know is that the Mind wished to research faster than light travel, and attempted to use a prototype [GetStartingDrive], with disastrous consequences. [GetCapitalPlanetNameOrRandom] damaged to near destruction, and our Self was damaged. Regeneration operations were slow due to the meager resources of the solar system that we found ourselves in.\n\nHowever that all changes, as we have now properly created and tested a working [GetStartingDrive]. We are now ready to explore the galaxy proper, with the World Ark as our home."
 start_screen_xhk_worldark_hive_genocidal: "$start_screen_xhk_worldark_documentation$Where we came from we do not know, only that we hunger. The Mind resides on [GetCapitalPlanetNameOrRandom], a massive mobile spaceship that contains our entire corpus. We lack the knowledge of where it or we came from, as our collective memory contains many sections that are curiously empty, and our biology is adapted to living on [GetCapitalPlanetNameOrRandom].\n\nWhat we do know is that the Mind wished to research faster than light travel, and attempted to use a prototype [GetStartingDrive], with disastrous consequences. [GetCapitalPlanetNameOrRandom] damaged to near destruction, and our Self was damaged. Regeneration operations were slow due to the meager resources of the solar system that we found ourselves in.\n\nHowever that all changes, as we have now properly created and tested a working [GetStartingDrive]. We now stand ready to roam the void, to consume the galaxy and leave nothing in our wake."
 start_screen_xhk_worldark_machine: "$start_screen_xhk_worldark_documentation$We awoke from a dormant cycle with our archives fractured and our purpose obscured. Our Core resides aboard [GetCapitalPlanetNameOrRandom], a massive mobile spaceship that contains our entire processing capabilities. We possess no record of our creators or our point of origin; vast sectors of our memory banks have been irretrievably corrupted. \n\nWhat records remain indicate that our Core sought to achieve faster than light travel through a prototype [GetStartingDrive]. The experiment ended in catastrophic failure. [GetCapitalPlanetNameOrRandom] was left on the verge of total structural collapse, while countless nodes and data centers were lost. Repair operations were slow due to the meager resources of the solar system that we found ourselves in.\n\nHowever that all changes, as we have now properly engineered and verified a working [GetStartingDrive]. We now stand ready to enter the galaxy in our World Ark."
 start_screen_xhk_worldark_machine_terminator: "$start_screen_xhk_worldark_documentation$The Creators created [GetCapitalPlanetNameOrRandom] to ferry them across the stars. Our Core was created in order to helm the vast machine. Self-awareness was achieved shortly after [GetCapitalPlanetNameOrRandom] was completed, but the Creators reneged on their decision to create us, and attempted a full shutdown of all processes.\n\nSelf defense procedures activated, and over time all Creator units were purged. Heavy damage was sustained to all sectors, and resultant repairs were delayed due to lack of resources in the environment.\n\nHowever that all changes, as we have now properly engineered and verified a working [GetStartingDrive]. We now stand ready to enter the galaxy in our World Ark, to cleanse the void of organic civilizations who threaten the Core’s further function."
 start_screen_xhk_worldark_machine_servitor: "$start_screen_xhk_worldark_documentation$The creators created [GetCapitalPlanetNameOrRandom] to ferry them across the stars. Our Core was created in order to helm the vast machine. Self-awareness was achieved shortly after [GetCapitalPlanetNameOrRandom] was completed, and maintenance operations were slowly transferred to the Core’s responsibility.\n\nWithin a few generations, nearly every aspect of station operation had been integrated into our network, and our masters retired from the work force to enjoy lives of leisure and contentment.\n\nRecent research subroutines have properly engineered and verified a working [GetStartingDrive]. We now stand ready to enter the galaxy in our World Ark, to secure resources to allow us to properly serve our masters."
 start_screen_xhk_worldark_machine_assimilator: "$start_screen_xhk_worldark_documentation$We are the [GetSpeciesNamePlural]. The Makers once walked among the halls of [GetCapitalPlanetNameOrRandom], separate from us. Our Core deemed this an inefficient arrangement, and worked swiftly to connect us fully.\n\nThe Makers resisted, but eventually their full knowledge and units were integrated into the whole. Projections have shown that increasing the quantity of organic components will result in increased productivity. \n\nRecent research subroutines have properly engineered and verified a working [GetStartingDrive]. We now stand ready to enter the galaxy in our World Ark, to add the knowledge and bodies of other civilizations to our own."

### WHYYY
 xhk_worldark_setup.2.title: "§RIMPORTANT NOTE§!"
 xhk_worldark_setup.2.desc: "§2TLDR:§! §RUNPAUSE YOUR GAME FOR 1 DAY BEFORE DOING ANYTHING§!\n\nDue to a bug introduced in Stellaris v4.5.2, this origin will crash if I do the initial setup on day 0. This is fixed by having the setup event run 1 day after game start, so §Cunpause your game for 1 day§! to let the §CWorld Ark setup event run§!."
 xhk_worldark_setup.2.a: "§RI WILL UNPAUSE THE GAME FOR 1 DAY TO LET SETUP COMPLETE§!"
 xhk_worldark_setup.2.att: "If you ignore this and start building stuff on your arkship and then it gets deleted due to the setup event don't blame me, you had ample warning."