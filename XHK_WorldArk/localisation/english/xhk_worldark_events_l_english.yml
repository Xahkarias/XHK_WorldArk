 # ARKSHIP LEVELS
 xhk_worldark_docs_ship_levels: "4) $xhk_pc_worldark$ Ship Levels"
 xhk_worldark_docs_ship_levels_desc: "$xhk_worldark_docs_ship_levels_desc_1$$xhk_worldark_docs_ship_levels_desc_T1$$xhk_worldark_docs_ship_levels_desc_T2$$xhk_worldark_docs_ship_levels_desc_T3$$xhk_worldark_docs_ship_levels_desc_T3_2$$xhk_worldark_docs_ship_levels_desc_T4$$xhk_worldark_docs_ship_levels_desc_T5$$xhk_worldark_docs_ship_levels_desc_T5_2$$xhk_worldark_docs_ship_levels_desc_T6$$xhk_worldark_docs_ship_levels_desc_T6_2$$xhk_worldark_docs_ship_levels_desc_T7$$xhk_worldark_docs_ship_levels_desc_T8$$xhk_worldark_docs_ship_levels_desc_T9$$xhk_worldark_docs_ship_levels_desc_T10$$xhk_worldark_docs_ship_levels_desc_2$"
 xhk_worldark_docs_ship_levels_desc_1: "The $xhk_pc_worldark$ gains multiple bonuses when leveling up the ship itself. While it gains bonuses such as increasingly larger defensive stats, and a mixture of the vanilla arkship bonuses, this list below notes the starbase, district, and weapons per level.\n"
 xhk_worldark_docs_ship_levels_desc_T1: "\n§GT1§! - §YStarbase:§!  4 Modules /  4 Buildings / 0 Spinal | §YBase Districts:§! 10 | §YWeapons:§!  2H  4P  4M"
 xhk_worldark_docs_ship_levels_desc_T2: "\n§GT2§! - §YStarbase:§!  8 Modules /  8 Buildings / 0 Spinal | §YBase Districts:§! 14 | §YWeapons:§!  4H  8P  4L 4M"
 xhk_worldark_docs_ship_levels_desc_T3: "\n§GT3§! - §YStarbase:§! 12 Modules / 12 Buildings / 0 Spinal | §YBase Districts:§! 18 | §YWeapons:§!  6H 16P  8L"
 xhk_worldark_docs_ship_levels_desc_T3_2: "\n$t$$t$Unlocks §GFirst $district_xhk_worldark_city$§! Specialization."
 xhk_worldark_docs_ship_levels_desc_T4: "\n§GT4§! - §YStarbase:§! 16 Modules / 16 Buildings / 0 Spinal | §YBase Districts:§! 22 | §YWeapons:§!  8H 20P 12L"
 xhk_worldark_docs_ship_levels_desc_T5: "\n§GT5§! - §YStarbase:§! 16 Modules / 20 Buildings / 0 Spinal | §YBase Districts:§! 26 | §YWeapons:§! 12H 24P 16L"
 xhk_worldark_docs_ship_levels_desc_T5_2: "\n$t$$t$Gains §GDouble£districtadd£Districts§! Increase when using §I$xhk_worldark_size_harvest$§!"
 xhk_worldark_docs_ship_levels_desc_T6: "\n§GT6§! - §YStarbase:§! 20 Modules / 24 Buildings / 0 Spinal | §YBase Districts:§! 30 | §YWeapons:§! 16H 28P 20L"
 xhk_worldark_docs_ship_levels_desc_T6_2: "\n$t$$t$Unlocks §GSecond $district_xhk_worldark_city$§! Specialization."
 xhk_worldark_docs_ship_levels_desc_T7: "\n§GT7§! - §YStarbase:§! 24 Modules / 28 Buildings / 0 Spinal | §YBase Districts:§! 34 | §YWeapons:§! 18H 30P 24L"
 xhk_worldark_docs_ship_levels_desc_T8: "\n§GT8§! - §YStarbase:§! 24 Modules / 32 Buildings / 2 Spinal | §YBase Districts:§! 38 | §YWeapons:§! 20H 32P 30L"
 xhk_worldark_docs_ship_levels_desc_T9: "\n§GT9§! - §YStarbase:§! 24 Modules / 36 Buildings / 4 Spinal | §YBase Districts:§! 44 | §YWeapons:§! 24H 36P 36L"
 xhk_worldark_docs_ship_levels_desc_T10: "\n§GT10§!- §YStarbase:§! 24 Modules / 40 Buildings / 6 Spinal | §YBase Districts:§! 50 | §YWeapons:§! 30H 40P 40L"
 xhk_worldark_docs_ship_levels_desc_2: "\n\nFurthermore, gain §G+5000 $mod_situation_nomad_economy_max_progress_add$§! per $xhk_pc_worldark$ level."

 ####################
 # CIVICS
 xhk_worldark_docs_special_civic: "5) Civic Integration"
 xhk_worldark_docs_special_civic_desc: "$xhk_worldark_docs_special_civic_desc_1$\n$xhk_worldark_docs_special_civic_desc_dystopia$[Owner.xhk_worldark_getCivicDocumentation]"
 xhk_worldark_docs_special_civic_desc_1: "The $xhk_pc_worldark$ has special integration with specific civics to better fit their fantasy and compensate for the one-planet playstyle."

 xhk_worldark_docs_special_civic_desc_norm: "\n§3Individualist Empire§!:$xhk_worldark_docs_special_civic_desc_norm_dystopia$$xhk_worldark_docs_special_civic_desc_norm_vampire$$xhk_worldark_docs_special_civic_desc_norm_tankbound$"
 xhk_worldark_docs_special_civic_desc_norm_dystopia: "\n§1$civic_dystopian_society$§!: $district_xhk_worldark_amenities_plural$ give $job_politician_plural$ instead of $job_entertainer_plural$, and are capped based on population."
 xhk_worldark_docs_special_civic_desc_norm_vampire: "\n§1$civic_entropy_drinkers$§!: $xhk_worldark_special_civic_doc_vampire_norm$"
 xhk_worldark_docs_special_civic_desc_norm_tankbound: "\n§1$civic_tankbound$§!: $xhk_worldark_special_civic_doc_tankbound$"

 xhk_worldark_docs_special_civic_desc_corp: "\n§3Megacorp Empire§!:$xhk_worldark_docs_special_civic_desc_corp_vampire$$xhk_worldark_docs_special_civic_desc_corp_tankbound$"
 xhk_worldark_docs_special_civic_desc_corp_vampire: "\n§1$civic_entropy_drinkers_corporate$§!: $xhk_worldark_special_civic_doc_vampire_norm$"
 xhk_worldark_docs_special_civic_desc_corp_tankbound: "\n§1$civic_tankbound_corporate$§!: $xhk_worldark_special_civic_doc_tankbound$"

 xhk_worldark_docs_special_civic_desc_hive: "\n§3Gestalt Hive Empire§!:$xhk_worldark_docs_special_civic_desc_hive_vampire$"
 xhk_worldark_docs_special_civic_desc_hive_vampire: "\n§1$civic_entropy_drinkers_hive_mind$§!: $xhk_worldark_special_civic_doc_vampire_gest$"

 xhk_worldark_docs_special_civic_desc_machine: "\n§3Gestalt Machine Empire§!:$xhk_worldark_docs_special_civic_desc_machine_vampire$"
 xhk_worldark_docs_special_civic_desc_machine_vampire: "\n§1$civic_entropy_drinkers_machine$§!: $xhk_worldark_special_civic_doc_vampire_gest$"

 # auxilary
 xhk_worldark_special_civic_doc_vampire_norm: "Gain §G1/3 $job_energy_thrall_plural$§! per growth job. This is additive to any other growth jobs."
 xhk_worldark_special_civic_doc_vampire_gest: "Gain §G1/3 $job_drone_energy_thrall_plural$§! per growth job. This is additive to any other growth jobs."
 xhk_worldark_special_civic_doc_tankbound: "Urban districts provide §G200 $job_production_overseer_plural$§!."

